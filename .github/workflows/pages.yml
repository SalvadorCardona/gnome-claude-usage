# The landing page, published to GitHub Pages.
#
# `docs/` is a single static file plus the screenshots it shows, so there is
# nothing to build: the folder is uploaded as it stands.
#
# Pages has to be switched on once by hand, in the repository settings, with
# "GitHub Actions" as the source. The `GITHUB_TOKEN` cannot do it: creating the
# site needs the repository administration permission, which a workflow token
# never gets, so asking `configure-pages` to enable it only fails the run.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs wait rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
